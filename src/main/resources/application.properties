spring.application.name=malay-shuttle
server.port=8080

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/malay_shuttle
spring.datasource.username=malay_app
spring.datasource.password=${DB_PASSWORD}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false